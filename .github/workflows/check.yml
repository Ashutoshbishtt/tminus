# Runs the same three things `make check` runs, on every push and pull request.
# If it is not green here, it does not get merged.

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres, because the db tests skip themselves without one and would
    # pass while proving nothing. Same image and credentials as docker-compose.yml
    # so the defaults find it with no configuration.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tminus
          POSTGRES_PASSWORD: tminus
          POSTGRES_DB: tminus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tminus -d tminus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: formatting
        # go fmt would rewrite the files and pass. This fails instead, and says
        # which files are wrong.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        # The race detector, because the whole project is about concurrency and a
        # race that only shows up on the laptop once a week is not worth having.
        run: go test -race ./...
